name: Doorbridge tests

# Runs the tests of every package the fork changes or that the UniFi talkback,
# keyframe and TURN code depends on, on pull requests against doorbridge and
# on pushes to doorbridge. Builds no images and pushes nothing (release.yml does that, on
# schedule or by hand only). The 386 job covers the 32-bit platforms upstream
# builds (386, arm/v6, arm/v7, mipsle), where int arithmetic overflows earlier.
on:
  pull_request:
    branches: [doorbridge]
  push:
    branches: [doorbridge]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doorbridge-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webrtc:
    name: Doorbridge tests (${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            flags: -race -count=3
            # Upstream data race in the RTSP backchannel: Conn.Stop
            # (producer.go) writes c.state under stateMu, Conn.Handle (conn.go)
            # reads it without the lock. Both files are unchanged from upstream.
            # These two tests fail under -race; they run without -race in the
            # step "RTSP backchannel tests without -race" below.
            rtsp_skip: -skip '^(TestBackchannelFallback|TestBackchannelSeparateSession)$'
          # The race detector is not available on 386; amd64 covers it.
          - goarch: "386"
            flags: -count=1
            rtsp_skip: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No cache: pull requests run unvetted code, and the Go cache scope is
      # shared with other workflows on the same ref.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Test with the toolchain the image is built with (GO_VERSION in
          # docker/Dockerfile, upstream build.yml uses the same), not the go.mod
          # minimum 1.26.0: with Go 1.26.0, pkg/rtsp TestURLParse never returns
          # (urlParse recurses on rtsp://::ffff:192.168.1.123/..., see DOORBRIDGE.md).
          go-version: "1.27"
          cache: false

      - name: go test
        env:
          GOARCH: ${{ matrix.goarch }}
        run: >-
          go test ${{ matrix.flags }}
          ./pkg/webrtc/... ./internal/webrtc/...
          ./pkg/creds/... ./pkg/tcp/... ./internal/streams/...
          ./pkg/unifi/... ./internal/unifi/... ./internal/rtsp/...
          ./pkg/core/... ./internal/ffmpeg/... ./pkg/hap/...

      - name: go test pkg/rtsp
        env:
          GOARCH: ${{ matrix.goarch }}
        run: go test ${{ matrix.flags }} ${{ matrix.rtsp_skip }} ./pkg/rtsp/...

      - name: RTSP backchannel tests without -race
        if: matrix.goarch == 'amd64'
        run: go test -count=3 -run '^(TestBackchannelFallback|TestBackchannelSeparateSession)$' ./pkg/rtsp/

name: Doorbridge tests

# Runs the WebRTC, RTSP and keyframe tests on pull requests against doorbridge and on pushes to
# doorbridge. Builds no images and pushes nothing (release.yml does that, on
# schedule or by hand only). The 386 job covers the 32-bit platforms upstream
# builds (386, arm/v6, arm/v7, mipsle), where int arithmetic overflows earlier.
on:
  pull_request:
    branches: [doorbridge]
  push:
    branches: [doorbridge]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doorbridge-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webrtc:
    name: WebRTC tests (${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            flags: -race -count=3
          # The race detector is not available on 386; amd64 covers it.
          - goarch: "386"
            flags: -count=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No cache: pull requests run unvetted code, and the Go cache scope is
      # shared with other workflows on the same ref.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      # The selections below deliberately avoid pre-existing failures
      # (pkg/core does not build its tests, internal/streams has two red tests,
      # and TestURLParse in pkg/rtsp hangs on the Go version this runner uses
      # until the 10 min test timeout; tracked separately):
      # the gate must only turn red for real defects. pkg/core is still
      # compiled through pkg/rtsp.
      - name: go test
        env:
          GOARCH: ${{ matrix.goarch }}
        run: go test ${{ matrix.flags }} -skip '^TestURLParse$' ./pkg/webrtc/... ./internal/webrtc/... ./pkg/rtsp/... ./internal/rtsp/... ./pkg/tcp/...

      - name: go test (keyframe forwarding)
        env:
          GOARCH: ${{ matrix.goarch }}
        run: go test ${{ matrix.flags }} -run 'Keyframe' ./internal/streams/

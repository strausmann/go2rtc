name: Release image

# The doorbridge image is built on a fixed schedule or by hand, never on a push
# or merge. Merging stays cheap; publishing is a deliberate, scheduled event.
#
# Triggers:
#   - schedule: daily at 04:00 UTC. If the image for the current commit already
#     exists, the run ends silently.
#   - workflow_dispatch: build ahead of schedule. "dry_run" only prints what
#     would be built.
#
# Tags: ghcr.io/<owner>/go2rtc:doorbridge (moving) and
#       ghcr.io/<owner>/go2rtc:doorbridge-<sha7> (immutable, one per commit).
on:
  schedule:
    - cron: '0 4 * * *'   # daily at 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only print what would be built"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and push image
    runs-on: ubuntu-24.04
    # workflow_dispatch can target any ref. Images must only ever come from
    # the doorbridge branch, so the job refuses everything else.
    if: github.ref == 'refs/heads/doorbridge'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/go2rtc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compute tag
        id: tag
        run: |
          sha7="$(git rev-parse --short=7 HEAD)"
          echo "sha7=$sha7" >> "$GITHUB_OUTPUT"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Tag:    doorbridge-$sha7"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the image exists
        id: exists
        env:
          SHA7: ${{ steps.tag.outputs.sha7 }}
        run: |
          set -u
          rc=0
          out="$(docker buildx imagetools inspect "$IMAGE:doorbridge-$SHA7" 2>&1)" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE:doorbridge-$SHA7 already exists, nothing to do."
          elif printf '%s' "$out" | grep -qi 'not found'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE:doorbridge-$SHA7 does not exist yet."
          else
            # Anything else (auth, network, registry error) must not look like "missing".
            echo "::error::imagetools inspect failed unexpectedly (exit $rc)"
            printf '%s\n' "$out"
            exit 1
          fi

      - name: Dry run
        if: steps.exists.outputs.exists == 'false' && inputs.dry_run
        env:
          SHA7: ${{ steps.tag.outputs.sha7 }}
        run: |
          echo "Dry run: would build docker/Dockerfile for linux/amd64,linux/arm64"
          echo "Dry run: would push $IMAGE:doorbridge and $IMAGE:doorbridge-$SHA7"

      - name: Set up QEMU
        if: steps.exists.outputs.exists == 'false' && !inputs.dry_run
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        if: steps.exists.outputs.exists == 'false' && !inputs.dry_run
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push
        if: steps.exists.outputs.exists == 'false' && !inputs.dry_run
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:doorbridge
            ${{ env.IMAGE }}:doorbridge-${{ steps.tag.outputs.sha7 }}
          labels: |
            org.opencontainers.image.title=go2rtc (doorbridge)
            org.opencontainers.image.description=go2rtc fork with UniFi Protect talkback (AlexxIT/go2rtc#2340)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=doorbridge-${{ steps.tag.outputs.sha7 }}
            org.opencontainers.image.licenses=MIT
          # No build cache: the GHA cache is writable from any job on this ref (including
          # the unvetted upstream check), so a published image must not depend on it.
          no-cache: true

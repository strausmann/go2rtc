<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>webrtc - go2rtc</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            padding: 0;
        }

        html, body, video {
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>
<video id="video" autoplay controls playsinline muted></video>
<script>
    // Short-lived TURN credentials come from the server; fall back to STUN only.
    async function fetchIceServers(fallback) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 2000);
        try {
            const r = await fetch('api/webrtc/ice', {credentials: 'same-origin', signal: ctrl.signal});
            if (!r.ok) return fallback;
            const data = await r.json();
            // only replace the built-in STUN servers when the server adds TURN credentials
            const hasTurn = Array.isArray(data.ice_servers) && data.ice_servers.some(s => s.credential);
            return hasTurn ? data.ice_servers : fallback;
        } catch (e) {
            return fallback;
        } finally {
            clearTimeout(timer);
        }
    }

    async function PeerConnection(media) {
        const stun = [{urls: ['stun:stun.cloudflare.com:3478', 'stun:stun.l.google.com:19302']}];
        const pc = new RTCPeerConnection({iceServers: await fetchIceServers(stun)});

        document.getElementById('video').srcObject = new MediaStream([
            pc.addTransceiver('audio', {direction: 'sendrecv'}).receiver.track,
            pc.addTransceiver('video', {direction: 'sendrecv'}).receiver.track,
        ]);

        const tracks = await navigator.mediaDevices.getUserMedia({
            video: media.indexOf('camera') >= 0,
            audio: media.indexOf('microphone') >= 0,
        });
        tracks.getTracks().forEach(track => {
            pc.addTrack(track);
        });

        return pc;
    }

    function getCompleteOffer(pc, timeout) {
        return new Promise((resolve, reject) => {
            pc.addEventListener('icegatheringstatechange', () => {
                if (pc.iceGatheringState === 'complete') resolve(pc.localDescription.sdp);
            });

            pc.createOffer().then(offer => pc.setLocalDescription(offer));

            setTimeout(() => resolve(pc.localDescription.sdp), timeout || 3000);
        });
    }

    async function connect() {
        const media = new URLSearchParams(location.search).get('media');
        const pc = await PeerConnection(media);
        const url = new URL('api/webrtc' + location.search, location.href);
        const r = await fetch(url, {method: 'POST', body: await getCompleteOffer(pc)});
        await pc.setRemoteDescription({type: 'answer', sdp: await r.text()});
    }

    connect();
</script>
</body>
</html>
